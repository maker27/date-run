name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:check
      - run: npm run build
      - run: npm run check:budgets
      - run: sudo apt-get update && sudo apt-get install -y nginx openssl
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run check:paths
