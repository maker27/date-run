services:
  app:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    env_file:
      - ${RUNTIME_ENV_FILE:?RUNTIME_ENV_FILE is required}
    ports:
      - "127.0.0.1:${HOST_PORT:?HOST_PORT is required}:3000"
    cpus: 2
    mem_limit: 4g
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 15s
